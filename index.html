<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JR Dhaka Rickshaw - Premium</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:white;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;overflow:hidden
}
.app{
 width:100%;max-width:440px;height:100dvh;
 background:linear-gradient(#55b9e8,#f7d68c);
 display:flex;flex-direction:column;padding:10px;
 position:relative;overflow:hidden
}
.top{
 display:flex;justify-content:space-between;
 background:#07101ddd;padding:9px 6px;
 border-radius:14px;z-index:5;
 box-shadow:0 4px 12px #0005
}
.top div{text-align:center}
.top b{font-size:16px;color:#ffd700}
.top span{display:block;font-size:10px;color:#ddd;margin-top:3px}
#road{
 flex:1;position:relative;overflow:hidden;
 background:linear-gradient(90deg,#444,#555 50%,#444);
 border:4px solid white;border-radius:15px;
 margin:10px 0;perspective:400px
}
.city{
 position:absolute;top:0;width:100%;height:25%;
 background:linear-gradient(#65bce9,#b4e2ee);
 display:flex;align-items:flex-end;justify-content:space-around
}
.building{
 width:15%;height:65%;background:#db9b53;
 border:2px solid #704a35;
 box-shadow:inset 0 0 0 3px #ffffff22;
}
.building:nth-child(2){height:90%;background:#d7c08c}
.building:nth-child(3){height:75%;background:#a95d42}
.building:nth-child(4){height:95%;background:#c9a36e}
.building:nth-child(5){height:60%;background:#8eaa80}
.window{
 width:100%;height:100%;
 background:repeating-linear-gradient(90deg,transparent 0 8px,#ffe69a 9px 13px,transparent 14px 22px);
}
.roadSurface{
 position:absolute;top:20%;bottom:0;width:100%;
 background:linear-gradient(90deg,#353535,#555,#353535);
}
.lane{
 position:absolute;top:0;bottom:0;width:4px;
 background:repeating-linear-gradient(to bottom,#ffe54a 0 35px,transparent 35px 70px);
 opacity:.8
}
.l1{left:33%}.l2{left:66%}
.sidewalk{
 position:absolute;top:20%;bottom:0;width:5%;
 background:repeating-linear-gradient(to bottom,#aaa 0 30px,#777 30px 60px);
}
.leftSide{left:0}.rightSide{right:0}
#rickshaw{
 position:absolute;bottom:13px;left:45%;
 font-size:59px;z-index:6;
 transform:scaleX(-1);
 filter:drop-shadow(0 8px 4px #0009);
 transition:left .10s,transform .15s;
 animation:ride .35s infinite alternate
}
@keyframes ride{
 from{translate:0 0}
 to{translate:0 -3px}
}
.vehicle,.passenger,.coin{
 position:absolute;z-index:4;
 filter:drop-shadow(0 4px 3px #0008)
}
.vehicle{font-size:43px}
.passenger{font-size:35px;animation:glow .7s infinite alternate}
.coin{font-size:28px;animation:spin 1s infinite alternate}
@keyframes glow{to{transform:scale(1.2);filter:drop-shadow(0 0 8px gold)}}
@keyframes spin{to{transform:rotateY(180deg) scale(1.15)}}
#msg{
 position:absolute;top:35%;left:50%;
 transform:translate(-50%,-50%);
 font-weight:bold;font-size:23px;
 text-shadow:0 3px 5px black;
 display:none;z-index:12;white-space:nowrap
}
.panel{
 background:#06101bdc;padding:8px 12px;
 border-radius:12px;font-size:12px;
}
#fuelBar{height:10px;background:#333;border-radius:10px;overflow:hidden;margin-top:5px}
#fuelFill{height:100%;width:100%;background:linear-gradient(90deg,#00ed60,#ffe000)}
.controls{display:flex;gap:9px;margin-top:9px}
.controls button{
 flex:1;padding:15px 0;border:0;border-radius:14px;
 background:linear-gradient(#26374e,#101a2a);
 color:white;font-size:25px;
 box-shadow:0 4px 0 #0007
}
.controls button:active{transform:translateY(3px);background:#ffc400;color:black}
.soundControls{display:flex;gap:8px;margin-top:7px}
.soundControls button{
 flex:1;padding:9px;border:0;border-radius:10px;
 background:#091527;color:white;font-weight:bold
}
#startScreen{
 position:absolute;inset:0;z-index:20;
 background:#030814eF;display:flex;
 flex-direction:column;align-items:center;
 justify-content:center;text-align:center;padding:20px
}
#startScreen h1{color:#ffd700;font-size:29px}
#startScreen p{line-height:1.8;color:#ddd}
.btn{
 padding:13px 28px;border:0;border-radius:25px;
 background:linear-gradient(90deg,#ffe000,#ff8c00);
 font-size:17px;font-weight:bold;margin:7px
}
.btn2{background:white}
.small{font-size:11px;color:#101828;text-align:center;font-weight:bold}
</style>
</head>

<body>
<div class="app">

<div class="top">
 <div><b id="money">৳ 0</b><span>Taka</span></div>
 <div><b id="pass">0</b><span>Passenger</span></div>
 <div><b id="dist">0m</b><span>Distance</span></div>
 <div><b id="best">৳ 0</b><span>Best</span></div>
</div>

<div id="road">

 <div class="city">
  <div class="building"><div class="window"></div></div>
  <div class="building"><div class="window"></div></div>
  <div class="building"><div class="window"></div></div>
  <div class="building"><div class="window"></div></div>
  <div class="building"><div class="window"></div></div>
 </div>

 <div class="roadSurface">
  <div class="lane l1"></div>
  <div class="lane l2"></div>
  <div class="sidewalk leftSide"></div>
  <div class="sidewalk rightSide"></div>
 </div>

 <div id="rickshaw">🛺</div>
 <div id="msg"></div>

 <div id="startScreen">
  <h1>🛺 JR DHAKA RICKSHAW</h1>
  <p>
   🔥 PREMIUM EDITION<br>
   🛺 Beautiful Rickshaw Animation<br>
   🏙️ Dhaka City Environment<br>
   🔔 Realistic Sound Effects<br><br>
   👨 Passenger = ৳50<br>
   🪙 Coin = ৳10<br>
   🚗 Accident = Game Over!
  </p>
  <h3 style="color:#ffd700">Best: <span id="best2">৳0</span></h3>
  <button class="btn" onclick="startGame()">▶ PLAY GAME</button>
  <button class="btn btn2" onclick="showHow()">❓ HOW TO PLAY</button>
 </div>

</div>

<div class="panel">
 ⛽ Fuel: <span id="fuelText">100%</span>
 <div id="fuelBar"><div id="fuelFill"></div></div>
</div>

<div class="controls">
 <button onclick="moveLeft()">⬅️</button>
 <button onclick="moveCenter()">🎯</button>
 <button onclick="moveRight()">➡️</button>
</div>

<div class="soundControls">
 <button onclick="toggleSound()" id="soundBtn">🔊 SOUND ON</button>
 <button onclick="ringBell()">🔔 RICKSHAW BELL</button>
 <button onclick="toggleMusic()" id="musicBtn">🎵 MUSIC ON</button>
</div>

<p class="small">🛺 JR GAMES • DHAKA RICKSHAW PREMIUM</p>
</div>

<script>
let money=0,passCount=0,dist=0,fuel=100;
let playing=false,rickX=45,speed=4;
let best=Number(localStorage.getItem("rickshawBest")||0);
let soundOn=true,musicOn=false;
let spawnTimer,gameTimer,animationFrame;
let musicTimer=null;
let roadOffset=0;

const $=id=>document.getElementById(id);
const road=$("road");

$("best").innerText="৳ "+best;
$("best2").innerText="৳ "+best;

// AUDIO SYSTEM
let audioCtx=null;

function initAudio(){
 if(!audioCtx){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 }
 if(audioCtx.state==="suspended")audioCtx.resume();
}

function tone(freq,duration,type="sine",volume=.15){
 if(!soundOn)return;
 initAudio();
 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();
 osc.type=type;
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(volume,audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
 osc.connect(gain);
 gain.connect(audioCtx.destination);
 osc.start();
 osc.stop(audioCtx.currentTime+duration);
}

function ringBell(){
 tone(1100,.15,"sine",.2);
 setTimeout(()=>tone(1500,.2,"sine",.15),100);
}

function coinSound(){
 tone(900,.12);
 setTimeout(()=>tone(1300,.2),100);
}

function passengerSound(){
 tone(500,.15);
 setTimeout(()=>tone(700,.2),130);
}

function crashSound(){
 tone(120,.5,"sawtooth",.3);
}

function toggleSound(){
 soundOn=!soundOn;
 $("soundBtn").innerText=soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";
 if(soundOn)ringBell();
}

function startMusic(){
 if(musicTimer||!musicOn)return;
 let notes=[261,329,392,329,293,349,440,349];
 let i=0;
 musicTimer=setInterval(()=>{
  if(playing&&musicOn){
   tone(notes[i%notes.length],.28,"triangle",.035);
   i++;
  }
 },400);
}

function stopMusic(){
 clearInterval(musicTimer);
 musicTimer=null;
}

function toggleMusic(){
 musicOn=!musicOn;
 $("musicBtn").innerText=musicOn?"🎵 MUSIC ON":"🎵 MUSIC OFF";
 if(musicOn){initAudio();startMusic()}
 else stopMusic();
}

// PLAYER
function updateRick(){
 $("rickshaw").style.left=rickX+"%";
}
function moveLeft(){
 if(playing){rickX=Math.max(7,rickX-12);updateRick()}
}
function moveRight(){
 if(playing){rickX=Math.min(81,rickX+12);updateRick()}
}
function moveCenter(){
 if(playing){rickX=45;updateRick()}
}

// TOUCH CONTROL
let dragging=false;

road.addEventListener("pointerdown",e=>{
 if(!playing)return;
 dragging=true;
 road.setPointerCapture(e.pointerId);
 moveToPointer(e);
});
road.addEventListener("pointermove",e=>{
 if(dragging&&playing)moveToPointer(e);
});
road.addEventListener("pointerup",()=>dragging=false);
road.addEventListener("pointercancel",()=>dragging=false);

function moveToPointer(e){
 let rect=road.getBoundingClientRect();
 rickX=Math.max(7,Math.min(81,(e.clientX-rect.left)/rect.width*100-8));
 updateRick();
}

// KEYBOARD
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")moveLeft();
 if(e.key==="ArrowRight"||e.key==="d")moveRight();
});

// START
function startGame(){
 initAudio();
 money=0;passCount=0;dist=0;fuel=100;
 speed=4;rickX=45;playing=true;
 updateRick();

 $("money").innerText="৳ 0";
 $("pass").innerText="0";
 $("dist").innerText="0m";
 $("fuelText").innerText="100%";
 $("fuelFill").style.width="100%";
 $("startScreen").style.display="none";
 $("msg").style.display="none";

 clearInterval(spawnTimer);
 clearInterval(gameTimer);
 cancelAnimationFrame(animationFrame);

 document.querySelectorAll(".vehicle,.passenger,.coin").forEach(e=>e.remove());

 spawnTimer=setInterval(()=>{
  if(playing)spawnVehicle();
 },850);

 setIntervalPassenger();

 gameTimer=setInterval(()=>{
  if(!playing)return;

  dist+=2;
  fuel-=.22;

  $("dist").innerText=dist+"m";
  $("fuelText").innerText=Math.max(0,Math.floor(fuel))+"%";
  $("fuelFill").style.width=Math.max(0,fuel)+"%";

  if(dist>500)speed=5;
  if(dist>1000)speed=6;
  if(dist>2000)speed=7;

  if(fuel<=0){
   gameOver("⛽ FUEL FINISHED!");
   return;
  }
  checkCollision();
 },60);

 animate();
 if(musicOn)startMusic();
}

function setIntervalPassenger(){
 clearInterval(passengerInterval);
 passengerInterval=setInterval(()=>{
  if(playing)spawnPassengerOrCoin();
 },1250);
}
let passengerInterval;

// SPAWN
function spawnVehicle(){
 let el=document.createElement("div");
 el.className="vehicle";
 let cars=["🚗","🚚","🚌","🚙","🏍️","🚕"];
 el.innerText=cars[Math.floor(Math.random()*cars.length)];
 el.style.left=(Math.random()*78+9)+"%";
 el.style.top="-60px";
 road.appendChild(el);
}

function spawnPassengerOrCoin(){
 let el=document.createElement("div");
 if(Math.random()<.5){
  el.className="passenger";
  el.innerText=Math.random()<.5?"🧍‍♂️":"🧍‍♀️";
  el.dataset.type="pass";
 }else{
  el.className="coin";
  el.innerText="🪙";
  el.dataset.type="coin";
 }
 el.style.left=(Math.random()*78+9)+"%";
 el.style.top="-50px";
 road.appendChild(el);
}

// ANIMATION
function animate(){
 if(!playing)return;

 roadOffset+=speed;
 document.querySelectorAll(".lane").forEach(l=>{
  l.style.backgroundPositionY=roadOffset+"px";
 });
 document.querySelectorAll(".vehicle,.passenger,.coin").forEach(el=>{
  let top=parseFloat(el.style.top||"-50");
  top+=speed+dist/500;
  el.style.top=top+"px";
  if(top>road.clientHeight+50)el.remove();
 });

 checkCollision();

 animationFrame=requestAnimationFrame(animate);
}

// COLLISION
function checkCollision(){
 if(!playing)return;
 let rRect=$("rickshaw").getBoundingClientRect();

 document.querySelectorAll(".vehicle,.passenger,.coin").forEach(el=>{
  let rect=el.getBoundingClientRect();
  let hit=!(
   rect.right<rRect.left+12||
   rect.left>rRect.right-12||
   rect.bottom<rRect.top+10||
   rect.top>rRect.bottom-10
  );

  if(!hit)return;

  if(el.classList.contains("vehicle")){
   el.remove();
   gameOver("💥 ACCIDENT!");
   return;
  }

  if(el.dataset.type==="pass"){
   passCount++;
   money+=50;
   $("pass").innerText=passCount;
   showMsg("👋 PASSENGER +৳50");
   passengerSound();
   if(navigator.vibrate)navigator.vibrate(40);
  }else if(el.dataset.type==="coin"){
   money+=10;
   showMsg("🪙 +৳10");
   coinSound();
  }

  $("money").innerText="৳ "+money;
  el.remove();
 });
}

function showMsg(t){
 let m=$("msg");
 m.innerText=t;
 m.style.display="block";
 clearTimeout(msgTimer);
 msgTimer=setTimeout(()=>m.style.display="none",700);
}
let msgTimer;

// GAME OVER
function gameOver(reason){
 if(!playing)return;
 playing=false;

 clearInterval(spawnTimer);
 clearInterval(gameTimer);
 clearInterval(passengerInterval);
 cancelAnimationFrame(animationFrame);

 stopMusic();
 crashSound();

 document.querySelectorAll(".vehicle,.passenger,.coin").forEach(e=>e.remove());

 if(money>best){
  best=money;
  localStorage.setItem("rickshawBest",best);
 }

 $("best").innerText="৳ "+best;
 $("best2").innerText="৳ "+best;

 $("startScreen").innerHTML=`
 <h1>GAME OVER 😢</h1>
 <h2 style="color:#ffd700">${reason}</h2>
 <p style="font-size:19px">
 💰 Taka: <b style="color:#ffd700">৳ ${money}</b><br>
 👨 Passenger: ${passCount}<br>
 🛣️ Distance: ${dist}m<br>
 🏆 Best: ৳ ${best}
 </p>
 <button class="btn" onclick="startGame()">🔄 PLAY AGAIN</button>
 `;
 $("startScreen").style.display="flex";

 if(navigator.vibrate)navigator.vibrate([100,50,150]);
}

function showHow(){
 alert(
 "🛺 HOW TO PLAY\n\n"+
 "⬅️➡️ Button diye Rickshaw chalাও\n"+
 "👆 Screen-e finger diye Rickshaw sorাও\n"+
 "👨 Passenger = ৳50\n"+
 "🪙 Coin = ৳10\n"+
 "🚗 Gari lagle Game Over\n"+
 "⛽ Fuel sesh hole Game Over\n"+
 "🔔 Bell button diye ghonta bajাও\n"+
 "🎵 Music ON/OFF korte paro"
 );
}
</script>
</body>
 </html>
