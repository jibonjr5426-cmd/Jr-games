<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>JR DHAKA RICKSHAW 3D | Premium 2.0</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#07111f;color:white;font-family:Arial,sans-serif;
  overflow:hidden;touch-action:none
}
#game{position:fixed;inset:0}
canvas{display:block}
button{
  border:0;border-radius:12px;padding:12px 16px;
  color:white;background:#182b43;font-weight:bold;
  cursor:pointer;font-size:14px
}
button:active{transform:scale(.96)}
button.primary{background:linear-gradient(135deg,#00c6ff,#0072ff)}
button.green{background:#087f5b}
button.red{background:#b92839}
button.gold{background:#a87512}
.hidden{display:none!important}
.panel{
  background:rgba(5,13,27,.94);border:1px solid #29415d;
  border-radius:18px;padding:18px;backdrop-filter:blur(10px)
}
#hud{
 position:fixed;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;gap:8px;
 pointer-events:none
}
.stat{
 background:rgba(4,12,24,.82);padding:8px 11px;
 border:1px solid #30475e;border-radius:12px;
 font-size:12px;min-width:65px
}
.stat b{display:block;color:#35e5ff;font-size:17px;margin-top:3px}
#fuelbox{
 position:fixed;top:90px;left:12px;width:150px;
 background:#101e30;border-radius:8px;padding:5px
}
#fuelbar{height:8px;width:100%;background:#00e5a0;border-radius:5px}
#policebar{
 position:fixed;top:90px;right:12px;width:140px;
 background:#101e30;border-radius:8px;padding:5px
}
#policefill{height:8px;background:#ff334b;width:0;border-radius:5px}
#topButtons{
 position:fixed;top:130px;right:12px;
 display:flex;flex-direction:column;gap:7px
}
#menu{
 position:fixed;inset:0;display:flex;align-items:center;
 justify-content:center;padding:15px;background:rgba(2,8,18,.45)
}
.menuCard{width:min(440px,100%);max-height:94vh;overflow:auto}
.logo{text-align:center;font-size:30px;font-weight:1000;color:#30d9ff}
.subtitle{text-align:center;color:#9eb7d0;margin:6px 0 16px}
.menuButtons{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.menuButtons button{min-height:48px}
.full{grid-column:1/-1}
#controls{
 position:fixed;bottom:18px;left:12px;right:12px;
 display:flex;justify-content:space-between;align-items:end;
 pointer-events:none
}
#controls button{pointer-events:auto;width:65px;height:65px;font-size:24px;
 background:rgba(13,29,48,.9);border:1px solid #3b607e}
#controls .center{width:75px;height:52px;font-size:13px}
#controls .steer{display:flex;gap:10px}
#controls .action{display:flex;gap:8px}
#message{
 position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);
 text-align:center;font-size:24px;font-weight:bold;
 text-shadow:0 2px 8px black;pointer-events:none
}
#modal{
 position:fixed;inset:0;display:flex;align-items:center;
 justify-content:center;padding:12px;background:rgba(0,0,0,.7)
}
.modalCard{width:min(460px,100%);max-height:90vh;overflow:auto}
h2{margin-bottom:12px;color:#42dfff}
h3{margin:13px 0 8px}
p{color:#c5d5e6;line-height:1.5}
.item{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;padding:10px;margin:7px 0;
 background:#102238;border-radius:12px
}
.item small{display:block;color:#a6bdd5;margin-top:4px}
.item button{white-space:nowrap}
#toast{
 position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
 background:#12263d;padding:12px 18px;border-radius:12px;
 display:none;border:1px solid #4a718f
}
@media(max-width:500px){
 .stat{min-width:53px;padding:7px;font-size:10px}
 .stat b{font-size:15px}
 #fuelbox{top:82px;width:120px}
 #policebar{top:82px;width:110px}
 #topButtons{top:116px}
 .logo{font-size:25px}
 .panel{padding:14px}
}
</style>
</head>

<body>
<div id="game"></div>

<div id="hud">
  <div class="stat">💰 Money<b id="money">৳0</b></div>
  <div class="stat">👤 Passenger<b id="passengers">0</b></div>
  <div class="stat">📏 Distance<b id="distance">0m</b></div>
  <div class="stat">🏆 Best<b id="best">0m</b></div>
</div>

<div id="fuelbox">
 <small>⛽ FUEL</small>
 <div id="fuelbar"></div>
</div>

<div id="policebar">
 <small>🚔 POLICE ALERT</small>
 <div id="policefill"></div>
</div>

<div id="topButtons">
 <button onclick="openGarage()">🛠️ Garage</button>
 <button onclick="openMaps()">🗺️ Maps</button>
 <button onclick="toggleWeather()">🌦️ Weather</button>
</div>

<div id="message"></div>

<div id="controls">
 <div class="steer">
  <button id="left">⬅️</button>
  <button id="right">➡️</button>
 </div>
 <div class="action">
  <button class="center" id="bell">🔔<br>Bell</button>
  <button class="center" id="boost">⚡<br>Boost</button>
 </div>
</div>

<div id="menu">
 <div class="panel menuCard">
  <div class="logo">JR GAMES</div>
  <div class="subtitle">DHaka Rickshaw 3D • Premium 2.0</div>

  <div class="menuButtons">
   <button class="primary full" onclick="startGame()">▶ START GAME</button>
   <button onclick="openGarage()">🛺 GARAGE</button>
   <button onclick="openMaps()">🗺️ MAPS</button>
   <button onclick="openLeaderboard()">🏆 LEADERBOARD</button>
   <button onclick="openUpgrades()">⚙️ UPGRADES</button>
   <button onclick="toggleWeather()">🌦️ WEATHER</button>
   <button class="full" onclick="showInstructions()">🎮 HOW TO PLAY</button>
  </div>

  <p style="text-align:center;margin-top:13px">
   Bank: <b id="bank">৳0</b>
  </p>
 </div>
</div>

<div id="modal" class="hidden">
 <div class="panel modalCard">
  <div id="modalContent"></div>
  <button class="full" style="margin-top:12px" onclick="closeModal()">✖ CLOSE</button>
 </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
"use strict";

/* =========================
   JR DHAKA RICKSHAW 3D
   PREMIUM VERSION 2.0
========================= */

const $ = id => document.getElementById(id);

const initialSave={
 bank:0,
 best:0,
 totalPassengers:0,
 selectedCar:0,
 ownedCars:[0],
 upgrades:{engine:0,fuel:0,handling:0,efficiency:0},
 leaderboard:[]
};

function clone(obj){
 return JSON.parse(JSON.stringify(obj));
}

function loadSave(){
 try{
  const s=JSON.parse(localStorage.getItem("jr_rickshaw_v2"));
  if(!s)return clone(initialSave);
  return {...clone(initialSave),...s,
   upgrades:{...initialSave.upgrades,...s.upgrades}};
 }catch(e){return clone(initialSave)}
}

let save=loadSave();

function persist(){
 try{
  localStorage.setItem("jr_rickshaw_v2",JSON.stringify(save));
 }catch(e){}
}

const cars=[
 {name:"Classic Rickshaw",price:0,color:0xff334f,speed:1},
 {name:"Blue Express",price:500,color:0x168aff,speed:1.08},
 {name:"Golden King",price:1200,color:0xffbd22,speed:1.15},
 {name:"Neon Racer",price:2500,color:0x25ffbe,speed:1.23},
 {name:"Police Special",price:4000,color:0xffffff,speed:1.3},
 {name:"Royal Premium",price:6500,color:0xc44aff,speed:1.4}
];

const maps=[
 {name:"Old Dhaka",sky:0x7db6d9,road:0x343943,building:0xc99b6a},
 {name:"Motijheel",sky:0x8bc6e8,road:0x262d38,building:0x8296aa},
 {name:"Hatirjheel",sky:0x8bd5e7,road:0x39424a,building:0x69a8a0},
 {name:"Night Dhaka",sky:0x09132d,road:0x171c2b,building:0x384a68},
 {name:"Rainy Dhaka",sky:0x657b91,road:0x222b35,building:0x718394}
];

let mapIndex=0;
let weather="clear";
let playing=false;
let gameOver=false;
let scene,camera,renderer,clock;
let player,playerGroup;
let roadGroup,cityGroup;
let traffic=[];
let coins=[];
let passengers=[];
let police=[];
let particles=[];
let lane=0;
let targetX=0;
let speed=15;
let distance=0;
let runMoney=0;
let runPassengers=0;
let fuel=100;
let alertLevel=0;
let boostTime=0;
let pickupTimer=0;
let spawnTimer=0;
let policeTimer=0;
let roadOffset=0;
let touchStartX=null;
let touchStartY=null;
let audioCtx=null;
let rainParticles=null;
let lastFrame=0;

const lanePositions=[-3.4,0,3.4];

init3D();
animate();
updateUI();

/* =========================
   THREE JS INITIALIZATION
========================= */

function init3D(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(maps[mapIndex].sky);
 scene.fog=new THREE.Fog(maps[mapIndex].sky,45,180);

 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
 camera.position.set(0,5.5,11);
 camera.lookAt(0,1,0);

 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 $("game").appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x38445a,1.3));

 const light=new THREE.DirectionalLight(0xffffff,1.1);
 light.position.set(-8,15,10);
 light.castShadow=true;
 scene.add(light);

 roadGroup=new THREE.Group();
 scene.add(roadGroup);

 cityGroup=new THREE.Group();
 scene.add(cityGroup);

 createRoad();
 createCity();
 createPlayer();
 createTraffic();
 createRain();

 clock=new THREE.Clock();

 window.addEventListener("resize",resize);
}

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

/* =========================
   3D OBJECT HELPERS
========================= */

function box(w,h,d,color,x,y,z,parent=scene){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:.8})
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

function cylinder(radius,height,color,x,y,z,parent=scene){
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(radius,radius,height,12),
  new THREE.MeshStandardMaterial({color})
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 parent.add(mesh);
 return mesh;
}

function createRoad(){
 const road=box(12,.2,220,maps[mapIndex].road,0,-.12,-70,roadGroup);

 box(1,.08,220,0xffffff,-6.1,0,-70,roadGroup);
 box(1,.08,220,0xffffff,6.1,0,-70,roadGroup);

 for(let z=0;z>-220;z-=10){
  box(.12,.04,4,0xffffff,0,.02,z,roadGroup);
  box(.12,.04,4,0xffffff,-3.4,.02,z,roadGroup);
  box(.12,.04,4,0xffffff,3.4,.02,z,roadGroup);
 }

 box(300,.3,300,0x263c2b,0,-.5,-80,roadGroup);
}

function createCity(){
 for(let side of [-1,1]){
  for(let i=0;i<38;i++){
   const z=-i*6-8;
   const w=4+Math.random()*5;
   const h=5+Math.random()*24;
   const x=side*(10+Math.random()*9);
   const color=maps[mapIndex].building;

   const building=box(w,h,w,color,x,h/2,z,cityGroup);
   building.userData.baseH=h;

   box(w*.65,.25,w*.65,0x45576a,x,h+.15,z,cityGroup);

   if(Math.random()>.55){
    box(w*.7,.35,w*.7,0xe1b74e,x,h+.4,z,cityGroup);
   }

   for(let y=1;y<h-1;y+=2.5){
    box(.65,.7,.12,0x9ce4ff,x-w*.2,y,z+w/2+.08,cityGroup);
    box(.65,.7,.12,0x9ce4ff,x+w*.2,y,z+w/2+.08,cityGroup);
   }
  }
 }
}

function createPlayer(){
 playerGroup=new THREE.Group();
 scene.add(playerGroup);

 const bodyColor=cars[save.selectedCar].color;

 const body=box(2.1,.45,2.5,bodyColor,0,1.15,0,playerGroup);
 body.userData.playerBody=true;

 box(1.6,.12,1.6,0x222222,0,.83,0,playerGroup);

 // Passenger seat
 box(1.3,.35,.8,0x222222,0,1.45,-.35,playerGroup);

 // Roof supports
 for(let x of [-.8,.8]){
  box(.12,1.35,.12,0xd9d9d9,x,1.85,-.4,playerGroup);
  box(.12,1.35,.12,0xd9d9d9,x,1.85,.65,playerGroup);
 }

 box(1.9,.15,1.4,0xffd45e,0,2.55,.1,playerGroup);
 box(1.9,.08,.1,0xffffff,0,2.45,.1,playerGroup);

 // wheels
 for(let x of [-1.05,1.05]){
  for(let z of [-.8,.8]){
   const wheel=cylinder(.36,.18,0x151515,x,.45,z,playerGroup);
   wheel.rotation.z=Math.PI/2;
  }
 }

 // front handle
 box(1.5,.12,.15,0x222222,0,1.1,1.25,playerGroup);

 player=playerGroup;
 player.position.set(0,0,4);
}

function createTrafficCar(color=0x22aaff){
 const group=new THREE.Group();

 box(1.9,.8,3.4,color,0,.8,0,group);
 box(1.5,.6,1.5,0x9ddfff,0,1.35,-.25,group);

 for(let x of [-1,1]){
  for(let z of [-1.1,1.1]){
   const w=cylinder(.35,.16,0x111111,x,.35,z,group);
   w.rotation.z=Math.PI/2;
  }
 }

 return group;
}

function createCNG(){
 const group=new THREE.Group();
 box(1.6,.8,2.3,0x13a65b,0,.7,0,group);
 box(1.1,.6,1.2,0xbbe9ff,0,1.2,-.15,group);
 box(1.8,.12,1.7,0x222222,0,1.4,0,group);

 for(let x of [-.9,.9]){
  for(let z of [-.7,.7]){
   const w=cylinder(.3,.15,0x111111,x,.3,z,group);
   w.rotation.z=Math.PI/2;
  }
 }
 return group;
}

function createRickshawTraffic(){
 const group=new THREE.Group();
 box(1.4,.25,2.1,0x168b50,0,.7,0,group);
 box(1.2,.8,1.3,0xeec95d,0,1.2,-.1,group);
 box(1.6,.12,1.8,0x242424,0,1.7,-.1,group);
 cylinder(.35,.2,0x111111,0,.35,.8,group);
 return group;
}

function createTraffic(){
 const types=[createTrafficCar,createCNG,createRickshawTraffic];
 for(let i=0;i<7;i++){
  const type=types[Math.floor(Math.random()*types.length)];
  const obj=type();
  obj.position.set(lanePositions[Math.floor(Math.random()*3)],0,-25-i*25);
  scene.add(obj);
  traffic.push({obj,speed:Math.random()*5+3});
 }
}

function createPassenger(){
 const group=new THREE.Group();
 cylinder(.25,.6,0x252525,0,.3,0,group);
 cylinder(.35,.35,0xffc79a,0,.8,0,group);
 box(.65,.7,0.3,0x1aa9ff,0,.45,0,group);
 group.position.set(lanePositions[Math.floor(Math.random()*3)],0,-100);
 scene.add(group);
 passengers.push({obj:group});
}

function createCoin(){
 const obj=new THREE.Mesh(
  new THREE.TorusGeometry(.42,.13,8,16),
  new THREE.MeshStandardMaterial({color:0xffd52b,metalness:.7,roughness:.25})
 );
 obj.position.set(lanePositions[Math.floor(Math.random()*3)],1.2,-100);
 scene.add(obj);
 coins.push({obj});
}

function createPoliceCar(){
 const group=createTrafficCar(0xffffff);
 box(1.7,.2,1.2,0x222222,0,1.35,-.2,group);
 box(.5,.18,.3,0xff2020,-.4,1.55,-.2,group);
 box(.5,.18,.3,0x168aff,.4,1.55,-.2,group);
 group.position.set(0,0,16);
 scene.add(group);
 police.push({obj:group});
}

function createRain(){
 const count=weather==="rain"?400:0;
 if(rainParticles){
  scene.remove(rainParticles);
  rainParticles.geometry.dispose();
  rainParticles.material.dispose();
  rainParticles=null;
 }
 if(!count)return;

 const geometry=new THREE.BufferGeometry();
 const positions=[];
 for(let i=0;i<count;i++){
  positions.push(
   (Math.random()-.5)*40,
   Math.random()*25,
   -Math.random()*70
  );
 }
 geometry.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));

 rainParticles=new THREE.Points(
  geometry,
  new THREE.PointsMaterial({color:0xaddfff,size:.08})
 );
 scene.add(rainParticles);
}

/* =========================
   GAME START / RESET
========================= */

function startGame(){
 if(!renderer)return;

 clearObjects();

 playing=true;
 gameOver=false;
 lane=1;
 targetX=0;
 speed=15+save.upgrades.engine*2;
 distance=0;
 runMoney=0;
 runPassengers=0;
 fuel=100+save.upgrades.fuel*15;
 alertLevel=0;
 boostTime=0;
 pickupTimer=0;
 spawnTimer=0;
 policeTimer=0;

 player.position.set(0,0,4);
 player.rotation.set(0,0,0);

 $("menu").classList.add("hidden");
 $("message").textContent="";
 updateUI();
 showToast("Game Started! 🛺");
}

function clearObjects(){
 for(const list of [traffic,coins,passengers,police]){
  list.forEach(item=>{
   scene.remove(item.obj);
  });
  list.length=0;
 }
}

function endGame(reason="Game Over"){
 if(!playing)return;
 playing=false;
 gameOver=true;

 save.bank+=runMoney;
 save.totalPassengers+=runPassengers;

 if(distance>save.best)save.best=Math.floor(distance);

 save.leaderboard.push({
  score:Math.floor(distance),
  money:runMoney,
  passengers:runPassengers,
  date:new Date().toLocaleDateString()
 });

 save.leaderboard.sort((a,b)=>b.score-a.score);
 save.leaderboard=save.leader.slice(0,10);

 persist();
 updateUI();

 $("message").textContent="🏁 "+reason;

 setTimeout(()=>{
  $("message").textContent="";
  $("menu").classList.remove("hidden");
  showGameOver();
 },900);
}

function showGameOver(){
 openModal(`
  <h2>🏁 GAME OVER</h2>
  <p>Distance: <b>${Math.floor(distance)}m</b></p>
  <p>Passengers: <b>${runPassengers}</b></p>
  <p>Earned: <b>৳${runMoney}</b></p>
  <p>Bank: <b>৳${save.bank}</b></p>
  <button class="primary full" onclick="closeModal();startGame()">🔄 PLAY AGAIN</button>
 `);
}

/* =========================
   MAIN GAME LOOP
========================= */

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock?clock.getDelta():0,.05);

 if(playing){
  updateGame(dt);
 }

 renderer.render(scene,camera);
}

function updateGame(dt){
 const car=cars[save.selectedCar];

 speed=Math.min(
  38,
  speed+dt*(.12+save.upgrades.engine*.025)
 );

 if(boostTime>0){
  boostTime-=dt;
  speed=Math.min(48,speed+dt*8);
 }

 distance+=speed*dt;
 fuel-=dt*(.65-save.upgrades.efficiency*.07);

 if(fuel<=0){
  fuel=0;
  endGame("⛽ FUEL EMPTY");
  return;
 }

 roadOffset+=speed*dt;

 // Player steering
 const handling=1+save.upgrades.handling*.2;
 player.position.x+=(targetX-player.position.x)*Math.min(1,dt*5*handling);

 player.rotation.z=THREE.MathUtils.clamp(
  (targetX-player.position.x)*-.12,-.22,.22
 );

 // camera follows
 camera.position.x+=(player.position.x*.35-camera.position.x)*dt*2;
 camera.lookAt(player.position.x*.2,1,0);

 // Road scroll
 roadGroup.children.forEach(obj=>{
  if(obj.position.z<-210)obj.position.z+=220;
  obj.position.z+=speed*dt;
 });

 // City scrolling
 cityGroup.children.forEach(obj=>{
  obj.position.z+=speed*dt;
  if(obj.position.z>15){
   obj.position.z-=228;
  }
 });

 // Traffic
 spawnTimer+=dt;
 if(spawnTimer>1.4){
  spawnTimer=0;
  const obj=Math.random()>.5?createCNG():createTrafficCar(
   [0xff3344,0x22aaff,0xffcc33,0xffffff][Math.floor(Math.random()*4)]
  );
  obj.position.set(lanePositions[Math.floor(Math.random()*3)],0,-110);
  scene.add(obj);
  traffic.push({obj,speed:Math.random()*5+3});
 }

 traffic.forEach((item,i)=>{
  item.obj.position.z+= (speed-item.speed)*dt*2;
  if(item.obj.position.z>20){
   scene.remove(item.obj);
   traffic.splice(i,1);
   return;
  }

  if(collide(player,item.obj,2.1,2.6)){
   crash();
  }
 });

 // Coins
 spawnTimer+=dt;
 if(Math.random()<dt*.5)createCoin();

 coins.forEach((item,i)=>{
  item.obj.position.z+=speed*dt;
  item.obj.rotation.y+=dt*3;

  if(collide(player,item.obj,1.5,1.8)){
   runMoney+=10;
   scene.remove(item.obj);
   coins.splice(i,1);
   showToast("🪙 +৳10");
  }else if(item.obj.position.z>20){
   scene.remove(item.obj);
   coins.splice(i,1);
  }
 });

 // Passenger pickup
 pickupTimer+=dt;
 if(pickupTimer>8 && passengers.length<2){
  pickupTimer=0;
  createPassenger();
 }

 passengers.forEach((item,i)=>{
  item.obj.position.z+=speed*dt;

  if(collide(player,item.obj,2,2.2)){
   runPassengers++;
   runMoney+=50;
   alertLevel=Math.min(100,alertLevel+15);
   scene.remove(item.obj);
   passengers.splice(i,1);
   passengerPickup();
   showToast("👤 Passenger picked up! +৳50");
  }else if(item.obj.position.z>20){
   scene.remove(item.obj);
   passengers.splice(i,1);
  }
 });

 // Police
 if(alertLevel>0){
  alertLevel=Math.max(0,alertLevel-dt*1.4);
 }

 policeTimer+=dt;
 if(alertLevel>45 && police.length===0 && policeTimer>4){
  policeTimer=0;
  createPoliceCar();
  showToast("🚔 POLICE CHASE!");
 }

 police.forEach((item,i)=>{
  item.obj.position.z-=dt*(2+alertLevel*.04);
  item.obj.position.x+=(player.position.x-item.obj.position.x)*dt*.4;

  if(item.obj.position.z<4){
   endGame("🚔 POLICE CAUGHT YOU");
  }
 });

 // Rain
 if(rainParticles){
  const arr=rainParticles.geometry.attributes.position.array;
  for(let i=1;i<arr.length;i+=3){
   arr[i]-=dt*25;
   if(arr[i]<0)arr[i]=25;
  }
  rainParticles.geometry.attributes.position.needsUpdate=true;
 }

 updateUI();
}

function collide(a,b,xRange,zRange){
 return Math.abs(a.position.x-b.position.x)<xRange &&
        Math.abs(a.position.z-b.position.z)<zRange;
}

function crash(){
 if(!playing)return;
 endGame("💥 RICKSHAW CRASH");
}

}

/* =========================
   GARAGE
========================= */

function openGarage(){
 let html=`<h2>🛺 PREMIUM GARAGE</h2>
 <p>Bank: ৳${save.bank}</p>`;

 cars.forEach((car,i)=>{
  const owned=save.ownedCars.includes(i);
  const selected=save.selectedCar===i;

  html+=`
   <div class="item">
    <div>
     <b>${car.name}</b>
     <small>${owned?"Unlocked":"Price ৳"+car.price}</small>
     <small>Speed x${car.speed}</small>
    </div>
    <button ${selected?"disabled":""}
     onclick="selectCar(${i})">
     ${selected?"Selected":owned?"Select":"Buy"}
    </button>
   </div>
  `;
 });

 openModal(html);
}

function selectCar(i){
 const car=cars[i];

 if(save.ownedCars.includes(i)){
  save.selectedCar=i;
  persist();
  changePlayerColor();
  openGarage();
  showToast("Rickshaw Selected 🛺");
  return;
 }

 if(save.bank>=car.price){
  save.bank-=car.price;
  save.ownedCars.push(i);
  save.selectedCar=i;
  persist();
  changePlayerColor();
  openGarage();
  updateUI();
  showToast("Rickshaw Unlocked!");
 }else{
  showToast("Not enough money!");
 }
}

function changePlayerColor(){
 if(!playerGroup)return;
 playerGroup.children.forEach(obj=>{
  if(obj.userData.playerBody){
   obj.material.color.setHex(cars[save.selectedCar].color);
  }
 });
}

/* =========================
   UPGRADES
========================= */

function openUpgrades(){
 const upgrades=[
  {id:"engine",name:"Engine Power",desc:"Increase speed",base:300},
  {id:"fuel",name:"Fuel Tank",desc:"Increase fuel capacity",base:250},
  {id:"handling",name:"Handling",desc:"Better steering",base:350},
  {id:"efficiency",name:"Fuel Efficiency",desc:"Reduce fuel consumption",base:400}
 ];

 let html=`<h2>⚙️ RICKSHAW UPGRADES</h2>
 <p>Bank: ৳${save.bank}</p>`;

 upgrades.forEach(u=>{
  const level=save.upgrades[u.id];
  const cost=u.base*(level+1);

  html+=`
   <div class="item">
    <div>
     <b>${u.name}</b>
     <small>${u.desc}</small>
     <small>Level ${level} • ৳${cost}</small>
    </div>
    <button onclick="buyUpgrade('${u.id}',${cost})">UPGRADE</button>
   </div>

}

function buyUpgrade(id,cost){
 if(save.bank<cost){
  showToast("Not enough money!");
  return;
 }

 if(save.upgrades[id]>=10){
  showToast("Maximum level!");
  return;
 }

 save.bank-=cost;
 save.upgrades[id]++;
 persist();

 openUpgrades();
 updateUI();
 showToast("Upgrade Successful ⚙️");
}

function selectMap(i){

 scene.background=new THREE.Color(maps[i].sky);
 scene.fog.color.setHex(maps[i].sky);

 roadGroup.children.forEach(obj=>{
  if(obj.material && obj.material.color){
   // Preserve road markings; update only road surface.
   if(obj.geometry.parameters.width>100){
    obj.material.color.setHex(maps[i].road);
   }
  }
 });

 cityGroup.children.forEach(obj=>{

     obj.geometry.parameters.width>2){

  }
 });

 persist();
 openMaps();
 showToast("Map changed: "+maps[i].name);
}

/* =========================
   INPUTS
========================= */

function moveLeft(){
 if(!playing)return;
 lane=Math.max(0,lane-1);
 targetX=lanePositions[lane];
}

function moveRight(){
 if(!playing)return;
 lane=Math.min(2,lane+1);
 targetX=lanePositions[lane];
}

function boost(){
 if(!playing)return;
 if(boostTime>0)return;
 boostTime=2.5;
 showToast("⚡ TURBO BOOST!");
}

function bell(){
 playSound(800,.1);
 showToast("🔔 Rickshaw Bell!");
}

$("left").addEventListener("pointerdown",e=>{
 e.preventDefault();
 moveLeft();
});

$("right").addEventListener("pointerdown",e=>{
 e.preventDefault();
 moveRight();
});

$("boost").addEventListener("pointerdown",e=>{
 e.preventDefault();
 boost();
});

$("bell").addEventListener("pointerdown",e=>{
 e.preventDefault();
 bell();
});

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")moveLeft();
 if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")moveRight();
 if(e.key===" "||e.key==="ArrowUp")boost();
 if(e.key==="b"||e.key==="B")bell();
});

/* Mobile swipe steering */
renderer.domElement.addEventListener("touchstart",e=>{
 if(!playing)return;
 const t=e.touches[0];
 touchStartX=t.clientX;
 touchStartY=t.clientY;
},{passive:true});

renderer.domElement.addEventListener("touchend",e=>{
 if(!playing||touchStartX===null)return;

 const t=e.changedTouches[0];
 const dx=t.clientX-touchStartX;
 const dy=t.clientY-touchStartY;

 if(Math.abs(dx)>35){
  if(dx<0)moveLeft();
  else moveRight();
 }else if(dy<-50){
  boost();
 }

 touchStartX=null;
 touchStartY=null;
},{passive:true});

/* =========================
   SOUND
========================= */

function playSound(freq=500,duration=.12){
 try{
  if(!audioCtx){
   audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.frequency.value=freq;
  gain.gain.value=.06;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration);
 }catch(e){}
}

/* =========================
   PARTICLE UPDATE
========================= */

function updateParticles(dt){
 particles.forEach((p,i)=>{
  p.life-=dt;
  p.obj.position.addScaledVector(p.dir,dt*4);

  if(p.life<=0){
   scene.remove(p.obj);
   particles.splice(i,1);
  }
 });
}
