<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR GAMES</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#090d18;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:22px;
 background:#121a2b;
 display:flex;
 justify-content:space-between;
}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#22d3ee}
.hero{
 padding:65px 20px;
 text-align:center;
}
.hero h1{font-size:48px}
.hero h1 span{color:#22d3ee}
button{
 background:#7c5cff;
 color:white;
 border:0;
 padding:12px 20px;
 border-radius:10px;
 cursor:pointer;
}
main{padding:20px}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:20px;
}
.card{
 background:#172238;
 padding:20px;
 border-radius:15px;
}
.thumb{
 background:#263a66;
 padding:35px;
 text-align:center;
 font-size:45px;
 border-radius:10px;
}
.card p{color:#aab5cc}
footer{
 text-align:center;
 padding:25px;
 color:#aaa;
}
</style>
</head>
<body>

<header>
 <div class="logo">JR <span>GAMES</span></div>
</header>

<section class="hero">
 <h1>PLAY. CREATE.<br><span>REPEAT.</span></h1>
 <p>Welcome to JR GAMES</p>
 <button onclick="document.getElementById('games').scrollIntoView()">
 Explore Games
 </button>
</section>

<main id="games">
 <h2>🎮 Featured Games</h2>
 <div class="grid" id="gameGrid">
  <div class="card">
   <div class="thumb">🚀</div>
   <h3>Coming Soon</h3>
   <p>Our first game is coming soon!</p>
  </div>
 </div>
</main>

<footer>
 © 2026 JR GAMES. All Rights Reserved.
</footer>

</body>
</html>
