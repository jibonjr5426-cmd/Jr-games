<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JR GAMES — 109 Games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b18;color:#fff;font-family:Arial,sans-serif}
header{background:#11182d;text-align:center;padding:22px;border-bottom:2px solid #00eaff}
h1{color:#00eaff;margin:0;font-size:32px}header p{color:#aaa;margin:8px 0}
.wrap{max-width:1100px;margin:auto;padding:18px}.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
button{background:#00d9ff;color:#07111d;border:0;border-radius:9px;padding:11px 15px;font-weight:bold;cursor:pointer;margin:4px}
button:hover{background:#00ff99}input{width:100%;padding:14px;border:2px solid #00eaff;border-radius:10px;background:#151c32;color:white;margin:14px 0}
.profile,.gamebox{background:#151c32;border:1px solid #263653;border-radius:14px;padding:17px;margin:12px 0;text-align:center}
.profile h2,.gamebox h2{color:#00eaff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px}
.card{background:linear-gradient(145deg,#182440,#101629);border:1px solid #263653;border-radius:14px;padding:16px;text-align:center}
.card:hover{border-color:#00eaff;transform:translateY(-3px)}.ico{font-size:38px}.card h3{font-size:16px;color:#00eaff;margin:8px 0}
.card p{font-size:12px;color:#aaa;min-height:28px}.hidden{display:none!important}
#play{min-height:230px;padding:12px}.big{font-size:55px;margin:15px}.score{color:#00ff99;font-size:19px;margin:12px}
.choice{display:inline-block;min-width:75px;min-height:65px;background:#263653;border-radius:10px;padding:15px;margin:5px;font-size:22px}
canvas{max-width:100%;background:#050a12;border:2px solid #00eaff;border-radius:8px;touch-action:manipulation}
footer{text-align:center;color:#888;padding:25px}
@media(max-width:450px){.wrap{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px}}
</style></head><body>
<header><h1>🎮 JR GAMES</h1><p>109 Games • Play • Have Fun</p>
<div class="bar"><button id="user">👤 Guest</button><button onclick="sound=!sound;this.textContent=sound?'🔊 SOUND ON':'🔇 SOUND OFF'">🔊 SOUND ON</button><button onclick="logout()">LOGOUT</button></div></header>
<main class="wrap">
<section id="home"><div class="profile"><h2>🏆 JR GAMING PROFILE</h2><p id="welcome">Welcome!</p><p class="score">Total best score: <span id="total">0</span></p></div>
<input id="search" placeholder="🔍 Search any of 109 games..." oninput="render()">
<p id="count" style="color:#aaa;margin:0 0 12px"></p><div class="grid" id="games"></div></section>
<section id="screen" class="gamebox hidden"><h2 id="title">Game</h2><p class="score">Best: <span id="best">0</span></p><div id="play"></div><button onclick="restart()">↻ RESTART</button><button onclick="home()">⌂ HOME</button></section>
</main><footer>© 2026 JR GAMES | Made with ❤️</footer>
<script>
const GAMES=[{"name": "Snake", "icon": "🐍", "type": "snake"}, {"name": "Tic Tac Toe", "icon": "⭕", "type": "ttt"}, {"name": "Rock Paper Scissors", "icon": "✊", "type": "rps"}, {"name": "Memory Match", "icon": "🧠", "type": "memory"}, {"name": "2048 Puzzle", "icon": "🔢", "type": "2048"}, {"name": "Number Guess", "icon": "🎯", "type": "guess"}, {"name": "Reaction Test", "icon": "⚡", "type": "reaction"}, {"name": "Whack A Mole", "icon": "🐹", "type": "mole"}, {"name": "Quick Quiz", "icon": "📚", "type": "quiz"}, {"name": "Ping Pong", "icon": "🏓", "type": "pong"}, {"name": "Brick Breaker", "icon": "🧱", "type": "brick"}, {"name": "Car Racing", "icon": "🏎️", "type": "runner"}, {"name": "Aim Trainer", "icon": "🎯", "type": "aim"}, {"name": "Flappy Bird", "icon": "🐦", "type": "flappy"}, {"name": "Minesweeper", "icon": "💣", "type": "mines"}, {"name": "Rock Dodge", "icon": "☄️", "type": "runner"}, {"name": "Color Match", "icon": "🎨", "type": "color"}, {"name": "Coin Toss", "icon": "🪙", "type": "coin"}, {"name": "Dice Roll", "icon": "🎲", "type": "dice"}, {"name": "Math Sprint", "icon": "➕", "type": "math"}, {"name": "Word Scramble", "icon": "🔤", "type": "word"}, {"name": "Typing Speed", "icon": "⌨️", "type": "typing"}, {"name": "Simon Says", "icon": "🟢", "type": "simon"}, {"name": "Odd One Out", "icon": "🧐", "type": "odd"}, {"name": "Higher or Lower", "icon": "📈", "type": "guess"}, {"name": "Quick Tap", "icon": "👆", "type": "tap"}, {"name": "Stopwatch Challenge", "icon": "⏱️", "type": "reaction"}, {"name": "Lucky Number", "icon": "🍀", "type": "guess"}, {"name": "Color Tap", "icon": "🌈", "type": "color"}, {"name": "Emoji Match", "icon": "😀", "type": "memory"}, {"name": "Addition Master", "icon": "➕", "type": "math"}, {"name": "Subtraction Pro", "icon": "➖", "type": "math"}, {"name": "Multiplication Rush", "icon": "✖️", "type": "math"}, {"name": "Division Dash", "icon": "➗", "type": "math"}, {"name": "Prime Number Test", "icon": "🔢", "type": "math"}, {"name": "Fast Counting", "icon": "💯", "type": "math"}, {"name": "Word Finder", "icon": "🔎", "type": "word"}, {"name": "Anagram Challenge", "icon": "🧩", "type": "word"}, {"name": "Letter Race", "icon": "🔤", "type": "typing"}, {"name": "Typing Ninja", "icon": "🥷", "type": "typing"}, {"name": "Keyboard Hero", "icon": "🎹", "type": "typing"}, {"name": "Pattern Memory", "icon": "🧠", "type": "memory"}, {"name": "Color Sequence", "icon": "🎨", "type": "simon"}, {"name": "Light Reaction", "icon": "💡", "type": "reaction"}, {"name": "Target Clicker", "icon": "🎯", "type": "aim"}, {"name": "Bubble Pop", "icon": "🫧", "type": "tap"}, {"name": "Star Catcher", "icon": "⭐", "type": "tap"}, {"name": "Fruit Catch", "icon": "🍎", "type": "runner"}, {"name": "Space Dodger", "icon": "🚀", "type": "runner"}, {"name": "Highway Escape", "icon": "🛣️", "type": "runner"}, {"name": "Rocket Pilot", "icon": "🚀", "type": "flappy"}, {"name": "Bird Hop", "icon": "🐤", "type": "flappy"}, {"name": "Ball Bounce", "icon": "🏀", "type": "tap"}, {"name": "Basket Shot", "icon": "🏀", "type": "aim"}, {"name": "Penalty Kick", "icon": "⚽", "type": "aim"}, {"name": "Goalkeeper", "icon": "🥅", "type": "reaction"}, {"name": "Mini Golf", "icon": "⛳", "type": "aim"}, {"name": "Table Tennis", "icon": "🏓", "type": "pong"}, {"name": "Paddle Smash", "icon": "🏓", "type": "pong"}, {"name": "Brick Smash", "icon": "💥", "type": "brick"}, {"name": "Block Breaker", "icon": "🟦", "type": "brick"}, {"name": "Gem Match", "icon": "💎", "type": "memory"}, {"name": "Card Pairs", "icon": "🃏", "type": "memory"}, {"name": "Treasure Hunt", "icon": "🗺️", "type": "mines"}, {"name": "Safe Finder", "icon": "🔐", "type": "mines"}, {"name": "Bomb Finder", "icon": "💣", "type": "mines"}, {"name": "Sudoku Mini", "icon": "🔢", "type": "sudoku"}, {"name": "Number Grid", "icon": "🔲", "type": "sudoku"}, {"name": "Sliding Tiles", "icon": "🧩", "type": "puzzle"}, {"name": "Tile Match", "icon": "🟪", "type": "puzzle"}, {"name": "Maze Runner", "icon": "迷", "type": "maze"}, {"name": "Mini Maze", "icon": "🌀", "type": "maze"}, {"name": "Path Finder", "icon": "🛤️", "type": "maze"}, {"name": "Jigsaw Lite", "icon": "🧩", "type": "puzzle"}, {"name": "Shape Sort", "icon": "🔺", "type": "odd"}, {"name": "Shape Match", "icon": "🔷", "type": "memory"}, {"name": "Shadow Match", "icon": "🌑", "type": "odd"}, {"name": "Find the Difference", "icon": "👀", "type": "odd"}, {"name": "True or False", "icon": "✅", "type": "quiz"}, {"name": "General Knowledge", "icon": "🌍", "type": "quiz"}, {"name": "Science Quiz", "icon": "🔬", "type": "quiz"}, {"name": "Geography Quiz", "icon": "🌏", "type": "quiz"}, {"name": "Sports Quiz", "icon": "🏆", "type": "quiz"}, {"name": "Animal Quiz", "icon": "🐼", "type": "quiz"}, {"name": "Flag Quiz", "icon": "🏳️", "type": "quiz"}, {"name": "Movie Quiz", "icon": "🎬", "type": "quiz"}, {"name": "Music Quiz", "icon": "🎵", "type": "quiz"}, {"name": "Riddle Time", "icon": "❓", "type": "quiz"}, {"name": "Brain Teaser", "icon": "🧠", "type": "quiz"}, {"name": "Logic Test", "icon": "💭", "type": "quiz"}, {"name": "Memory Numbers", "icon": "🔢", "type": "memory"}, {"name": "Sequence Recall", "icon": "🔁", "type": "simon"}, {"name": "Repeat the Pattern", "icon": "🟢", "type": "simon"}, {"name": "Fast Fingers", "icon": "🤏", "type": "tap"}, {"name": "Tap the Target", "icon": "🎯", "type": "aim"}, {"name": "Precision Test", "icon": "📍", "type": "aim"}, {"name": "Coin Flip Streak", "icon": "🪙", "type": "coin"}, {"name": "Dice Challenge", "icon": "🎲", "type": "dice"}, {"name": "Lucky Dice", "icon": "🍀", "type": "dice"}, {"name": "Heads or Tails", "icon": "🪙", "type": "coin"}, {"name": "Quick Arithmetic", "icon": "🧮", "type": "math"}, {"name": "Word Spelling", "icon": "✍️", "type": "word"}, {"name": "Unscramble It", "icon": "🔠", "type": "word"}, {"name": "Typing Race", "icon": "🏁", "type": "typing"}, {"name": "Color Reflex", "icon": "🟥", "type": "color"}, {"name": "Neon Reflex", "icon": "💠", "type": "reaction"}, {"name": "Catch the Dot", "icon": "🔵", "type": "tap"}, {"name": "Dodge the Blocks", "icon": "🧱", "type": "runner"}, {"name": "Space Runner", "icon": "👨‍🚀", "type": "runner"}];
let player=localStorage.getItem('jr109_player')||'Guest',sound=true,current=null,interval=null,timeout=null,score=0,state={};
function beep(f=500){if(!sound)return;try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.04;o.start();o.stop(c.currentTime+.09)}catch(e){}}
function profile(){document.getElementById('user').textContent='👤 '+player;document.getElementById('welcome').textContent='Welcome, '+player+'!';let s=JSON.parse(localStorage.getItem('jr109_scores_'+player)||'{}');document.getElementById('total').textContent=Object.values(s).reduce((a,b)=>a+b,0)}
function logout(){let n=prompt('Enter player name:',player);if(n&&n.trim()){player=n.trim();localStorage.setItem('jr109_player',player);profile();render()}}
function save(n){let s=JSON.parse(localStorage.getItem('jr109_scores_'+player)||'{}');s[current.name]=Math.max(s[current.name]||0,Math.max(0,n));localStorage.setItem('jr109_scores_'+player,JSON.stringify(s));document.getElementById('best').textContent=s[current.name];profile()}
function render(){let q=document.getElementById('search').value.toLowerCase(),list=GAMES.filter(g=>g.name.toLowerCase().includes(q));document.getElementById('count').textContent='Showing '+list.length+' of 109 games';document.getElementById('games').innerHTML=list.map(g=>`<article class="card"><div class="ico">${g.icon}</div><h3>${g.name}</h3><p>Play this mini game</p><button onclick="openGame('${g.name.replace(/'/g,"\\'")}')">PLAY NOW</button></article>`).join('')}
function cleanup(){clearInterval(interval);clearTimeout(timeout);interval=timeout=null}
function openGame(name){cleanup();current=GAMES.find(g=>g.name===name);document.getElementById('home').classList.add('hidden');document.getElementById('screen').classList.remove('hidden');document.getElementById('title').textContent=current.icon+' '+name;let s=JSON.parse(localStorage.getItem('jr109_scores_'+player)||'{}');document.getElementById('best').textContent=s[name]||0;restart()}
function home(){cleanup();document.getElementById('screen').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}
function restart(){cleanup();score=0;state={};play()}
function area(s){document.getElementById('play').innerHTML=s}
function scoreLine(){return `<p class="score">Score: <b id="sc">${score}</b></p>`}
function add(n=1){score+=n;let e=document.getElementById('sc');if(e)e.textContent=score;beep()}
function finish(msg='Game over!'){cleanup();area(scoreLine()+`<h2>${msg}</h2><p>Score: ${score}</p>`);save(score)}
function btn(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;document.getElementById('play').appendChild(b)}
function play(){
let t=current.type;
if(t==='guess'){state.secret=1+Math.floor(Math.random()*100);area('<p>Guess a number from 1 to 100</p><input id="v" type="number"><button onclick="guess()">GUESS</button><p id="msg"></p>');return}
if(t==='coin'||t==='dice'){area('<div class="big" id="face">'+(t==='coin'?'🪙':'🎲')+'</div>'+scoreLine());btn(t==='coin'?'FLIP COIN':'ROLL DICE',()=>{let n=t==='coin'?(Math.random()<.5?'HEADS':'TAILS'):1+Math.floor(Math.random()*6);document.getElementById('face').textContent=t==='coin'?n:['','⚀','⚁','⚂','⚃','⚄','⚅'][n];if(t==='coin'||n===6)add();save(score)});return}
if(t==='quiz'||t==='math'||t==='word'||t==='odd'||t==='color'||t==='simon'){quizMode(t);return}
if(t==='memory'){memory();return}
if(t==='ttt'){ttt();return}
if(t==='mines'||t==='sudoku'||t==='puzzle'||t==='maze'){gridPuzzle(t);return}
if(t==='reaction'||t==='tap'||t==='aim'){tapGame(t);return}
if(t==='typing'){typing();return}
if(t==='runner'||t==='flappy'||t==='pong'||t==='brick'){canvasGame(t);return}
if(t==='rps'){rps();return}
}
function guess(){let n=+document.getElementById('v').value,m=document.getElementById('msg');if(n===state.secret){m.textContent='🎉 Correct!';add(10);save(score)}else m.textContent=n<state.secret?'Too low!':'Too high!'}
function quizMode(t){
let questions=t==='math'?[()=>{let a=2+Math.floor(Math.random()*20),b=1+Math.floor(Math.random()*10);return [`${a} + ${b} = ?`,[a+b,a+b+1,a+b-1].sort(()=>Math.random()-.5),a+b]}]:[
()=>['Capital of Bangladesh?',['Dhaka','Delhi','Kathmandu'],'Dhaka'],
()=>['5 × 6 = ?',['30','25','35'],'30'],
()=>['Which is a planet?',['Mars','Moon','Sun'],'Mars'],
()=>['Days in a week?',['7','5','9'],'7']];
let q=questions[Math.floor(Math.random()*questions.length)]();if(typeof q==='function')q=q();
if(t==='word')q=['Unscramble: LPAEP',['APPLE','GRAPE','LEMON'],'APPLE'];
if(t==='color')q=['Which is a color?',['BLUE','TABLE','CHAIR'],'BLUE'];
if(t==='odd')q=['Which one is different?',['APPLE','BANANA','CAR'],'CAR'];
if(t==='simon')q=['Remember this number: '+(state.num=Math.floor(Math.random()*8)+1),['1','2','3','4','5','6','7','8'],String(state.num)];
if(t==='quiz'||t==='math'||t==='word'||t==='color'||t==='odd'||t==='simon'){}
area(scoreLine()+`<h3>${q[0]}</h3><div id="opts"></div><p id="feedback"></p>`);
q[1].forEach(v=>btn(v,()=>{let ok=String(v)===String(q[2]);document.getElementById('feedback').textContent=ok?'Correct!':'Try again!';if(ok){add(1);save(score);setTimeout(()=>quizMode(t),650)}}));
}
function memory(){let a=['🍎','🍌','🍇','🍒','🚀','⚽','💎','🐱'];state.cards=[...a,...a].sort(()=>Math.random()-.5);state.open=[];state.done=[];area(scoreLine()+'<div id="mem" class="grid" style="grid-template-columns:repeat(4,60px)"></div>');drawMem()}
function drawMem(){let el=document.getElementById('mem');el.innerHTML='';state.cards.forEach((v,i)=>{let b=document.createElement('button');b.style.width='60px';b.style.height='60px';b.textContent=state.done.includes(i)||state.open.includes(i)?v:'❔';b.onclick=()=>flip(i);el.appendChild(b)})}
function flip(i){if(state.open.includes(i)||state.done.includes(i)||state.open.length===2)return;state.open.push(i);drawMem();if(state.open.length===2){if(state.cards[state.open[0]]===state.cards[state.open[1]]){state.done.push(...state.open);state.open=[];add();save(score);if(state.done.length===16)finish('YOU WIN!');else drawMem()}else timeout=setTimeout(()=>{state.open=[];drawMem()},650)}}
function ttt(){state.board=Array(9).fill('');state.turn='X';area('<p id="st">Player X</p><div id="tt" class="grid" style="grid-template-columns:repeat(3,75px)"></div>');drawTT()}
function drawTT(){let el=document.getElementById('tt');el.innerHTML='';state.board.forEach((v,i)=>{let b=document.createElement('button');b.style.height='70px';b.style.fontSize='25px';b.textContent=v;b.onclick=()=>{if(v||state.done)return;state.board[i]=state.turn;let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];if(wins.some(a=>a.every(j=>state.board[j]===state.turn))){state.done=true;document.getElementById('st').textContent=state.turn+' wins!';if(state.turn==='X')save(1)}else if(state.board.every(Boolean)){state.done=true;document.getElementById('st').textContent='Draw'}else{state.turn=state.turn==='X'?'O':'X';document.getElementById('st').textContent='Player '+state.turn}drawTT()};el.appendChild(b)})}
function rps(){area('<div class="big" id="r">🤔</div><p id="rr">Choose!</p>');['✊ Rock','✋ Paper','✌️ Scissors'].forEach((x)=>btn(x,()=>{let a=x.split(' ')[0],opts=['✊','✋','✌️'],b=opts[Math.floor(Math.random()*3)],win=(a==='✊'&&b==='✌️')||(a==='✋'&&b==='✊')||(a==='✌️'&&b==='✋');document.getElementById('r').textContent=a+' VS '+b;document.getElementById('rr').textContent=a===b?'Draw':win?'You win!':'Computer wins';if(win){add();save(score)}}))}
function tapGame(t){state.time= t==='reaction'?0:15;state.ready=false;area('<p id="tm">Tap the target as fast as you can!</p><button id="target" style="padding:30px" onclick="hitTarget()">START</button>');}
function hitTarget(){let b=document.getElementById('target');if(current.type==='reaction'&&!state.ready){b.textContent='WAIT...';timeout=setTimeout(()=>{state.ready=true;state.start=Date.now();b.textContent='CLICK NOW!'},1000+Math.random()*2500);b.onclick=()=>{if(!state.ready){clearTimeout(timeout);document.getElementById('tm').textContent='Too early! Restart.';return}let ms=Date.now()-state.start;document.getElementById('tm').textContent=ms+' ms';save(Math.max(1,1000-ms));};return}add();save(score);b.style.margin=Math.random()*80+'px';if(score>=10)finish('Great job!')}
function typing(){let words=['JAVASCRIPT','GAMING','COMPUTER','BANGLADESH','CHALLENGE'];state.word=words[Math.floor(Math.random()*words.length)];area(scoreLine()+`<h2>${state.word}</h2><input id="typed" placeholder="Type the word"><button onclick="typeCheck()">CHECK</button><p id="tymsg"></p>`)}
function typeCheck(){if(document.getElementById('typed').value.toUpperCase()===state.word){add(5);save(score);document.getElementById('tymsg').textContent='Correct!';typing()}else document.getElementById('tymsg').textContent='Try again'}
function gridPuzzle(t){let n=t==='mines'?25:16;state.bombs=new Set();if(t==='mines'){while(state.bombs.size<5)state.bombs.add(Math.floor(Math.random()*n))}state.open=new Set();area(scoreLine()+`<p>${t==='mines'?'Avoid hidden bombs!':'Tap the tiles to score!'}</p><div id="tiles" class="grid" style="grid-template-columns:repeat(5,48px)"></div>`);let el=document.getElementById('tiles');for(let i=0;i<n;i++){let b=document.createElement('button');b.style.width='48px';b.style.height='48px';b.textContent='?';b.onclick=()=>{if(state.open.has(i))return;state.open.add(i);if(state.bombs.has(i)){b.textContent='💣';finish('BOOM!')}else{b.textContent='✓';add();save(score);if(state.open.size===n-state.bombs.size)finish('YOU WIN!')}};el.appendChild(b)}}
function canvasGame(t){area(scoreLine()+'<canvas id="cv" width="360" height="280"></canvas><p>Use ← and → keys or tap left/right side</p>');let c=document.getElementById('cv'),x=c.getContext('2d');state.x=160;state.y=230;state.bx=180;state.by=120;state.vx=3;state.vy=3;state.tick=0;c.onclick=e=>{let r=c.getBoundingClientRect();state.x=e.clientX<r.left+r.width/2?70:290};interval=setInterval(()=>{x.fillStyle='#050a12';x.fillRect(0,0,360,280);if(t==='runner'||t==='flappy'){state.by+=3;if(state.by>280){state.by=0;add();save(score)}x.fillStyle='#00ff99';x.fillRect(state.x,230,25,30);x.fillStyle='#ff3355';x.fillRect(state.bx,state.by,25,25);state.bx=(state.bx+5)%360}else{x.fillStyle='#00ff99';x.fillRect(state.x,250,70,10);state.bx+=state.vx;state.by+=state.vy;if(state.bx<5||state.bx>355)state.vx*=-1;if(state.by<5||state.by>245)state.vy*=-1;x.fillStyle='#ffcc00';x.beginPath();x.arc(state.bx,state.by,7,0,7);x.fill();if(t==='brick'&&++state.tick%20===0){add();save(score)}}},30)}
profile();render();
</script></body></html>
